<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#0E3B2E" />
<title>골프 스코어 정산</title>
<style>
:root {
  --bg: #0E3B2E;
  --panel: #0A2C22;
  --panelLight: #134534;
  --cream: #F2EBD8;
  --creamDim: rgba(242,235,216,0.55);
  --line: rgba(242,235,216,0.14);
  --red: #E4572E;
  --brass: #C8A96A;
  --ok: #7FD1A8;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--cream); }
body {
  font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
#app { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
.hidden { display: none !important; }

h1 { font-size: 20px; margin: 16px 0 4px; }
.subtitle { font-size: 13px; color: var(--creamDim); margin-bottom: 20px; line-height: 1.5; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 16px;
  margin-bottom: 14px;
}

label { display: block; font-size: 12px; color: var(--brass); font-weight: 700; margin: 12px 0 6px; letter-spacing: 0.04em; }
label:first-child { margin-top: 0; }

input[type="text"], input[type="number"] {
  width: 100%;
  padding: 11px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--cream);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

button { font-family: inherit; cursor: pointer; }
.btn-primary {
  width: 100%; padding: 13px 0; background: var(--cream); color: var(--bg);
  border: none; border-radius: 4px; font-weight: 800; font-size: 15px; margin-top: 16px;
}
.btn-ghost {
  padding: 8px 14px; background: transparent; color: var(--brass);
  border: 1px solid var(--brass); border-radius: 4px; font-weight: 700; font-size: 12.5px;
}
.mode-btn {
  padding: 12px 4px; background: transparent; color: var(--brass);
  border: 1px solid var(--line); border-radius: 4px; font-weight: 700; font-size: 12.5px;
  text-align: center; line-height: 1.4;
}
.mode-btn.active { background: var(--brass); color: var(--panel); border-color: var(--brass); }
.mode-btn .sub { display: block; font-size: 10.5px; font-weight: 500; color: inherit; opacity: 0.8; margin-top: 2px; }

.team-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 800; letter-spacing: 0.03em; }
.team-a { color: var(--brass); border: 1px solid var(--brass); }
.team-b { color: var(--red); border: 1px solid var(--red); }

.player-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid var(--brass); color: var(--brass);
  font-size: 11px; font-weight: 800; flex-shrink: 0;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 14px;
}
.summary > div { padding: 14px; text-align: center; background: var(--panel); }
.summary .amt { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 4px; }
.net-line { text-align: center; font-size: 13.5px; color: var(--creamDim); margin: -4px 0 14px; }
.net-line b { color: var(--ok); }

.progress { text-align: center; font-size: 12.5px; color: var(--creamDim); margin-bottom: 14px; }

.hole-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.hole-head .n { font-size: 22px; font-weight: 900; }
.pot-tag { font-size: 13px; color: var(--brass); font-weight: 700; }
.pot-tag .carry { color: var(--red); }

.bonus-banner {
  background: linear-gradient(135deg, rgba(200,169,106,0.28), rgba(228,87,46,0.2));
  border: 1px solid var(--brass);
  border-radius: 4px;
  padding: 10px 14px;
  margin-bottom: 14px;
  text-align: center;
  font-weight: 800;
  font-size: 14px;
  color: var(--brass);
}

.par-row { display: flex; gap: 8px; margin-bottom: 14px; }
.par-btn {
  flex: 1; padding: 9px 0; background: transparent; color: var(--brass);
  border: 1px solid var(--line); border-radius: 4px; font-weight: 700; font-size: 13px;
}
.par-btn.active { background: var(--brass); color: var(--panel); border-color: var(--brass); }

.player-block { margin-bottom: 14px; }
.player-block .pname { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip {
  padding: 6px 10px; background: transparent; color: var(--creamDim);
  border: 1px solid var(--line); border-radius: 12px; font-size: 12px; font-weight: 700;
}

.player-input { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.player-input .pname { flex: 1; font-size: 14px; font-weight: 600; }
.player-input input { width: 72px; text-align: center; }

.hole-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 14px; border-top: 1px solid var(--line); font-size: 13.5px; cursor: pointer;
}
.hole-row:first-child { border-top: none; }
.hole-row .left { display: flex; gap: 10px; align-items: center; }
.hole-row .hn { color: var(--creamDim); width: 22px; }
.hole-row .result { font-weight: 700; }
.hole-row .result.win-a { color: var(--brass); }
.hole-row .result.win-b { color: var(--red); }
.hole-row .result.carry { color: var(--creamDim); }

.final-banner {
  background: var(--panelLight);
  border: 1px solid var(--ok);
  border-radius: 4px;
  padding: 16px;
  margin-bottom: 14px;
  text-align: center;
}
.final-banner .title { color: var(--ok); font-weight: 800; font-size: 13px; margin-bottom: 6px; }
.final-banner .amount { font-size: 26px; font-weight: 900; }

.empty-note {
  padding: 16px;
  text-align: center;
  color: var(--creamDim);
  font-size: 13px;
  font-style: italic;
}

table.result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.result-table th, table.result-table td {
  padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line);
}
table.result-table th { color: var(--brass); font-size: 11px; font-weight: 700; }
table.result-table td.name { text-align: left; font-weight: 700; }
table.result-table tr:first-child td { color: var(--ok); font-weight: 800; }

.settle-row {
  display: flex; justify-content: space-between; padding: 10px 14px;
  border-top: 1px solid var(--line); font-size: 13.5px;
}
.settle-row:first-child { border-top: none; }
.settle-row .amt.pos { color: var(--ok); font-weight: 800; }
.settle-row .amt.neg { color: var(--red); font-weight: 800; }

.peoria-list { font-size: 12.5px; color: var(--creamDim); line-height: 1.8; }
.section-gap { margin-top: 22px; }

/* ---- 단체전 ---- */
.mode-wide { width: 100%; margin-top: 8px; }

.tab-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
.tab {
  flex: 1; min-width: 64px; padding: 9px 0; background: transparent; color: var(--creamDim);
  border: 1px solid var(--line); border-radius: 4px; font-weight: 700; font-size: 12.5px;
}
.tab.active { background: var(--panelLight); color: var(--cream); border-color: var(--brass); }

.grow {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0; border-top: 1px solid var(--line);
}
.grow:first-of-type { border-top: none; }
.grow .gname { flex: 1; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
.grow .gname span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cart-pill {
  font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 3px;
  border: 1px solid var(--line); color: var(--creamDim); flex-shrink: 0;
}
.stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.stepper button {
  width: 34px; height: 34px; background: var(--panelLight); color: var(--cream);
  border: 1px solid var(--line); border-radius: 4px; font-size: 18px; font-weight: 800; line-height: 1;
}
.stepper .val { width: 46px; text-align: center; }
.stepper .val .num { font-size: 18px; font-weight: 900; display: block; line-height: 1.1; }
.stepper .val .rel { font-size: 10px; color: var(--creamDim); }
.stepper .val .rel.over { color: var(--red); }
.stepper .val .rel.under { color: var(--ok); }
.stepper .oy {
  width: auto; padding: 0 8px; height: 34px; font-size: 11px; font-weight: 700; color: var(--brass);
  background: transparent;
}

.special-box {
  background: var(--panelLight); border: 1px solid var(--brass); border-radius: 4px;
  padding: 12px; margin: 4px 0 14px;
}
.special-box .lab { font-size: 12px; font-weight: 800; color: var(--brass); margin-bottom: 8px; }
.name-chip {
  padding: 7px 11px; background: transparent; color: var(--creamDim);
  border: 1px solid var(--line); border-radius: 14px; font-size: 12.5px; font-weight: 700;
}
.name-chip.on { background: var(--brass); color: var(--panel); border-color: var(--brass); }

.award {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  border-top: 1px solid var(--line);
}
.award:first-child { border-top: none; }
.award .ico { font-size: 22px; width: 26px; text-align: center; }
.award .body { flex: 1; min-width: 0; }
.award .cat { font-size: 11px; font-weight: 800; color: var(--brass); letter-spacing: 0.04em; }
.award .who { font-size: 16px; font-weight: 900; margin-top: 1px; }
.award .det { font-size: 11.5px; color: var(--creamDim); margin-top: 2px; line-height: 1.5; }

.round-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer;
}
.round-item:first-child { border-top: none; }
.round-item .t { font-size: 13.5px; font-weight: 700; }
.round-item .s { font-size: 11.5px; color: var(--creamDim); margin-top: 3px; }
.round-item .del { color: var(--creamDim); font-size: 16px; background: none; border: none; padding: 4px 6px; }

.pl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pl-row .idx { width: 18px; font-size: 12px; color: var(--creamDim); flex-shrink: 0; }
.pl-row input { flex: 1; min-width: 0; }
.pl-row select {
  width: 74px; padding: 11px 6px; background: var(--bg); color: var(--cream);
  border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 13px;
}
.pl-row .rm { background: none; border: none; color: var(--creamDim); font-size: 18px; padding: 4px 2px; }

.toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 0; border-top: 1px solid var(--line);
}
.toggle-row .tl { font-size: 13.5px; font-weight: 600; }
.toggle-row .td { font-size: 11.5px; color: var(--creamDim); margin-top: 3px; line-height: 1.45; }
.sw {
  width: 46px; height: 26px; border-radius: 13px; border: 1px solid var(--line);
  background: var(--bg); position: relative; flex-shrink: 0;
}
.sw::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--creamDim); transition: all .15s;
}
.sw.on { background: var(--brass); border-color: var(--brass); }
.sw.on::after { left: 22px; background: var(--panel); }

.warn-note {
  font-size: 11.5px; color: var(--red); margin-top: 8px; line-height: 1.5;
}
.btn-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn-secondary {
  padding: 12px 0; background: transparent; color: var(--brass);
  border: 1px solid var(--brass); border-radius: 4px; font-weight: 800; font-size: 13.5px;
}
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--cream); color: var(--bg); padding: 10px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 800; z-index: 99; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- core/random.js ----
// ---- 스킨스: 보너스 홀 뽑기 (전반 중 1홀, 후반 있으면 후반 중 1홀) ----
function pickBonusHoles(totalHoles) {
  const frontCount = Math.min(9, totalHoles);
  const indices = [Math.floor(Math.random() * frontCount)];
  if (totalHoles > 9) {
    const backCount = totalHoles - 9;
    indices.push(9 + Math.floor(Math.random() * backCount));
  }
  return indices;
}

// ---- 신페리오: 전/후반 각 6홀(총 12홀) 비복원 추출 ----
function sample(arr, n) {
  const copy = [...arr];
  const out = [];
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(idx, 1)[0]);
  }
  return out;
}
function pickPeoriaHoles() {
  const front = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  const back = [9, 10, 11, 12, 13, 14, 15, 16, 17];
  return [...sample(front, 6), ...sample(back, 6)].sort((a, b) => a - b);
}

function uid() {
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
}


// ---- core/skins.js ----

const PLAYER_KEYS = ["a1", "a2", "b1", "b2"];
const BONUS_MULTIPLIER = 2;

// mode: "skins" | "peoria" | "both" — 신페리오가 포함되면 18홀 고정(페리오 홀 규칙상 필수).
// club/courseFront/courseBack은 전부 선택 입력 — 기본값 빈 문자열.
// 코스를 전/후반으로 나눈 이유: 많은 골프장이 "동코스+서코스"처럼 9홀짜리 코스를 조합해서 18홀을 만들고,
// 전반과 후반이 다른 코스인 경우가 흔하다(스코어카드 자체가 전/후반 다른 코스 파 정보를 가진 경우도 있음).
// players(v2, {a1,a2,b1,b2}: playerId|null)와 seasonId(T3용, 지금은 항상 null)는 파라미터가 이미
// 8개라 옵션 객체로 받는다 — newGroupState와 같은 스타일.
function newState({ mode, names, totalHoles, skinsStake, peoriaStake, club = "", courseFront = "", courseBack = "", players = null, seasonId = null }) {
  const needsSkins = mode !== "peoria";
  const needsPeoria = mode !== "skins";
  const bonusSet = needsSkins ? new Set(pickBonusHoles(totalHoles)) : new Set();
  return {
    mode,
    startedAt: Date.now(),
    names,          // {a1,a2,b1,b2}
    totalHoles,
    skinsStake,
    peoriaStake,
    club,
    courseFront,
    courseBack,
    players,        // v2: {a1,a2,b1,b2}: playerId|null — 선수 등록부 연결용, 계산에는 아직 안 씀
    seasonId,       // T3(시즌)용 자리. 지금은 항상 null
    peoriaHoles: needsPeoria ? pickPeoriaHoles() : [],
    holes: Array.from({ length: totalHoles }, (_, i) => ({
      par: null, a1: null, a2: null, b1: null, b2: null,
      bonus: bonusSet.has(i) ? BONUS_MULTIPLIER : null,
    })),
  };
}

// 순수 계산(스킨스): 원본 입력값만 저장, 팀합산/승패/캐리오버/누적금액은 매번 다시 계산.
function computeSkins(state) {
  let carry = 0;
  let totalA = 0, totalB = 0;
  const rows = [];
  for (let i = 0; i < state.holes.length; i++) {
    const h = state.holes[i];
    if (h.a1 == null || h.a2 == null || h.b1 == null || h.b2 == null) break;
    const teamA = h.a1 + h.a2;
    const teamB = h.b1 + h.b2;
    const mult = h.bonus || 1;
    const pot = (state.skinsStake + carry) * mult;
    let winner;
    if (teamA < teamB) { winner = "A"; totalA += pot; carry = 0; }
    else if (teamB < teamA) { winner = "B"; totalB += pot; carry = 0; }
    else { winner = "carry"; carry = pot; }
    rows.push({ idx: i, ...h, teamA, teamB, winner, pot });
  }
  return { rows, carry, totalA, totalB, currentIdx: rows.length };
}

function defaultPar(state, beforeIdx) {
  for (let i = beforeIdx - 1; i >= 0; i--) {
    if (state.holes[i].par != null) return state.holes[i].par;
  }
  return 4;
}

// 완료된 홀 수 — par와 4명 타수가 전부 채워진 선두 구간 길이.
function countDone(state) {
  let n = 0;
  for (const h of state.holes) {
    if (h.par == null || PLAYER_KEYS.some((k) => h[k] == null)) break;
    n++;
  }
  return n;
}


// ---- core/peoria.js ----

// 신페리오 핸디캡: 페리오 12홀 합계 × 1.5 = 추정 스코어, (추정 스코어 - 코스파) × 0.8 = 핸디캡(반올림).
// 넷스코어 = 총타수 - 핸디캡. 모든 쌍(i,j)이 넷스코어 차이 × 타당 금액으로 주고받는 제로섬 정산.
function computePeoria(state) {
  const coursePar = state.holes.reduce((s, h) => s + (h.par || 0), 0);
  const results = PLAYER_KEYS.map((key) => {
    const total = state.holes.reduce((s, h) => s + h[key], 0);
    const peoriaSum = state.peoriaHoles.reduce((s, idx) => s + state.holes[idx][key], 0);
    const estimated = peoriaSum * 1.5;
    const handicap = Math.round((estimated - coursePar) * 0.8);
    const net = total - handicap;
    return { key, name: state.names[key], total, peoriaSum, estimated, handicap, net, settle: 0 };
  });

  const pairwise = [];
  for (let i = 0; i < results.length; i++) {
    for (let j = i + 1; j < results.length; j++) {
      const a = results[i], b = results[j];
      const diff = b.net - a.net; // b가 못 쳤으면(net이 크면) b가 a에게 지급
      const amount = diff * state.peoriaStake;
      a.settle += amount;
      b.settle -= amount;
      if (amount !== 0) {
        pairwise.push(amount > 0
          ? { from: b.name, to: a.name, amount }
          : { from: a.name, to: b.name, amount: -amount });
      }
    }
  }

  results.sort((x, y) => x.net - y.net);
  return { coursePar, results, pairwise };
}


// ---- core/group.js ----

// ===================== 단체전 =====================
// 인원 가변(보통 2카트 8명, 그 이상도 가능). 팀 정산이 아니라 시상이 목적이라
// 타수 1등 / 신페리오 1등 / 파3 니어 / 파5 롱기를 뽑는다.
function newGroupState(opts) {
  const totalHoles = 18; // 신페리오·카운트백 모두 18홀 기준
  return {
    mode: "group",
    startedAt: Date.now(),
    title: opts.title,
    club: opts.club || "",
    courseFront: opts.courseFront || "",
    courseBack: opts.courseBack || "",
    usePeoria: opts.usePeoria,
    excludeGross: opts.excludeGross,
    // playerId(v2, 선수 등록부 참조)는 id(이 라운드 안에서만 쓰는 임시 키 — scores/nearest/longest가
    // 이걸로 사람을 가리킨다)와 별개다. id를 playerId로 바꾸면 기존 계산 코드를 다 건드려야 해서
    // 그대로 두고 playerId만 나란히 붙인다.
    players: opts.players.map((p) => ({ id: uid(), name: p.name, cart: p.cart, playerId: p.playerId ?? null })),
    seasonId: opts.seasonId ?? null, // T3(시즌)용 자리. 지금은 항상 null
    totalHoles,
    peoriaHoles: opts.usePeoria ? pickPeoriaHoles() : [],
    holes: Array.from({ length: totalHoles }, () => ({
      par: null, scores: {}, longest: null, nearest: null,
    })),
  };
}

function holeFilledGroup(state, h) {
  return h.par != null && state.players.every((p) => typeof h.scores[p.id] === "number");
}
function countDoneGroup(state) {
  let n = 0;
  for (const h of state.holes) {
    if (!holeFilledGroup(state, h)) break;
    n++;
  }
  return n;
}

// 동타 처리: 후반 9홀 → 마지막 6홀 → 3홀 → 마지막 홀 순으로 적은 쪽이 우선(카운트백).
function countback(a, b) {
  for (const n of [9, 6, 3, 1]) {
    if (a.length < n || b.length < n) continue;
    const sa = a.slice(-n).reduce((s, v) => s + v, 0);
    const sb = b.slice(-n).reduce((s, v) => s + v, 0);
    if (sa !== sb) return sa - sb;
  }
  return 0;
}

function computeGroup(state) {
  const done = countDoneGroup(state);
  const played = state.holes.slice(0, done);
  const complete = done === state.totalHoles;
  const coursePar = played.reduce((s, h) => s + h.par, 0);
  const peoriaReady = state.usePeoria && complete;

  const rows = state.players.map((p) => {
    const strokes = played.map((h) => h.scores[p.id]);
    const total = strokes.reduce((s, v) => s + v, 0);
    const row = {
      id: p.id, name: p.name, cart: p.cart, strokes, total,
      vsPar: total - coursePar, handicap: null, net: null, peoriaSum: null,
    };
    if (peoriaReady) {
      const peoriaSum = state.peoriaHoles.reduce((s, i) => s + state.holes[i].scores[p.id], 0);
      const estimated = peoriaSum * 1.5;
      const handicap = Math.round((estimated - coursePar) * 0.8);
      row.peoriaSum = peoriaSum;
      row.estimated = estimated;
      row.handicap = handicap;
      row.net = total - handicap;
    }
    return row;
  });

  // 타수(그로스) 순위 — 총타수 → 카운트백
  const gross = [...rows].sort((x, y) => (x.total - y.total) || countback(x.strokes, y.strokes));
  // 신페리오 순위 — 넷스코어 → 핸디캡 적은 쪽(=실력자) 우선 → 카운트백
  const peoria = peoriaReady
    ? [...rows].sort((x, y) => (x.net - y.net) || (x.handicap - y.handicap) || countback(x.strokes, y.strokes))
    : [];

  const grossWinner = done > 0 ? gross[0] : null;
  // 중복 수상 제외 옵션이 켜져 있으면 타수 1등은 신페리오 시상 대상에서 뺀다.
  let peoriaWinner = null;
  if (peoriaReady) {
    peoriaWinner = state.excludeGross && grossWinner
      ? peoria.find((r) => r.id !== grossWinner.id) || null
      : peoria[0];
  }

  const nameOf = (id) => (state.players.find((p) => p.id === id) || {}).name || "";
  const nearest = [];
  const longest = [];
  for (let i = 0; i < done; i++) {
    const h = state.holes[i];
    if (h.par === 3 && h.nearest) nearest.push({ hole: i + 1, id: h.nearest, name: nameOf(h.nearest) });
    if (h.par === 5 && h.longest) longest.push({ hole: i + 1, id: h.longest, name: nameOf(h.longest) });
  }
  const tally = (list) => {
    const map = new Map();
    for (const x of list) map.set(x.name, (map.get(x.name) || 0) + 1);
    return [...map.entries()].sort((a, b) => b[1] - a[1]);
  };

  return {
    done, complete, coursePar, peoriaReady, rows, gross, peoria,
    grossWinner, peoriaWinner, nearest, longest,
    nearestTally: tally(nearest), longestTally: tally(longest),
  };
}

// 파 대비 스코어 용어 — 칩 버튼과 홀별 기록 표시에 공용으로 쓴다.
// "트리플+"처럼 "이상"을 뜻하는 라벨을 쓰면 눌렀을 때 실제로는 +3만 들어가는 것과 헷갈려서
// (파4에서 4오버를 의도하고 이 칩을 눌렀지만 실제로는 3오버=7타만 저장된 사례) 델타를 하나씩 명확히 늘어놓는다.
const REL_CHIPS = [
  { delta: -2, label: "이글" },
  { delta: -1, label: "버디" },
  { delta: 0, label: "파" },
  { delta: 1, label: "보기" },
  { delta: 2, label: "더블" },
  { delta: 3, label: "트리플" },
  { delta: 4, label: "+4" },
  { delta: 5, label: "+5" },
];
// 양파는 파 기준 상대타수가 아니라 "무조건 8타"를 가리키는 관용 표현이라 절대값으로 따로 둔다.
const ONYANG_STROKES = 8;

function holeLabel(v, par) {
  if (v === ONYANG_STROKES) return "양파";
  const found = REL_CHIPS.find((c) => c.delta === v - par);
  if (found) return found.label;
  const delta = v - par;
  return delta > 0 ? `+${delta}` : `${delta}`;
}

const ROUNDS_KEY = "golfScoring:rounds";   // 종료된 라운드 보관함

const MAX_ARCHIVE = 60;

// ---- 보관함: 새 라운드를 시작해도 지난 라운드가 남도록 별도 키에 쌓는다 ----
function loadRounds() {
  try {
    const raw = localStorage.getItem(ROUNDS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function saveRounds(rounds) {
  localStorage.setItem(ROUNDS_KEY, JSON.stringify(rounds.slice(0, MAX_ARCHIVE)));
}
// 같은 라운드를 두 번 저장하지 않도록 startedAt을 식별자로 쓴다.
function archiveRound(st) {
  if (!st) return false;
  const rounds = loadRounds();
  // data-id는 항상 문자열로 돌아오므로 식별자도 문자열로 통일한다.
  const started = st.startedAt || Date.now();
  const id = String(started);
  const snapshot = { ...st, startedAt: started };
  const existing = rounds.findIndex((r) => r.id === id);
  const entry = { id, savedAt: Date.now(), state: snapshot };
  if (existing >= 0) rounds[existing] = entry;
  else rounds.unshift(entry);
  saveRounds(rounds);
  return true;
}
function deleteRound(id) {
  saveRounds(loadRounds().filter((r) => r.id !== id));
}

function loadRoster() {
  try {
    const raw = localStorage.getItem(ROSTER_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
// 최근에 같이 친 사람이 앞으로 오도록 정렬해두면 다음 모임에서 탭 몇 번으로 명단이 완성된다.
function rememberNames(names) {
  const clean = names.map((n) => String(n).trim()).filter(Boolean);
  const merged = [...clean, ...loadRoster().filter((n) => !clean.includes(n))];
  localStorage.setItem(ROSTER_KEY, JSON.stringify(merged.slice(0, 40)));
}

// 정확히 같은 이름 문자열이면 같은 사람으로 본다 — 동명이인 구분용 UI는 없다(선택 UX: 텍스트 입력 +
// 자동 매칭). archived(더 이상 안 나오는 사람)는 매칭 대상에서 뺀다 — 옛 사람 이름이 우연히 다시
// 나와도 조용히 되살아나지 않고 새 선수로 만들어지는 편이 안전하다.
// 배열을 직접 바꾸지 않고 새 배열을 돌려준다 — 호출자가 players를 계속 스레딩해서 쓴다(마이그레이션이
// 여러 이름을 순서대로 resolve할 때 누적된 결과를 다음 호출에 넘겨야 하기 때문).
function resolvePlayer(players, name) {
  const trimmed = String(name || "").trim();
  if (!trimmed) return { players, id: null };

  const existing = players.find((p) => !p.archived && p.name === trimmed);
  if (existing) return { players, id: existing.id };

  const created = { id: uid(), name: trimmed, aliases: [], createdAt: Date.now(), archived: false };
  return { players: [...players, created], id: created.id };
}

// ---- data/schema.js ----

const SCHEMA_KEY = "golfScoring:schemaVersion";

// 순수 변환: 이미 JSON.parse된 state/rounds/players를 받아 v2 모양으로 바꿔 돌려준다.
// localStorage를 직접 만지지 않는다 — 그래서 jsdom 없이 그냥 Node에서 테스트할 수 있다.
// names/name 필드는 그대로 남긴다(롤백 대비, docs/DATA_MODEL.md 마이그레이션 규칙 4번) — 화면 표시나
// computeSkins/computePeoria/computeGroup은 지금 그대로 이 필드들을 쓰고, players/playerId는 T3
// 시즌 랭킹을 위한 신규 연결고리일 뿐 기존 계산에는 아직 관여하지 않는다.
function migrateStore({ state, rounds, players }) {
  let registry = Array.isArray(players) ? players : [];

  function resolve(name) {
    const result = resolvePlayer(registry, name);
    registry = result.players;
    return result.id;
  }

  function migrateRound(round) {
    if (!round) return round;
    if (round.mode === "group") {
      const migratedPlayers = round.players.map((p) => ({ ...p, playerId: resolve(p.name) }));
      return { ...round, players: migratedPlayers, seasonId: round.seasonId ?? null };
    }
    const playerIds = {};
    for (const k of ["a1", "a2", "b1", "b2"]) playerIds[k] = resolve(round.names[k]);
    return { ...round, players: playerIds, seasonId: round.seasonId ?? null };
  }

  const migratedState = migrateRound(state);
  const migratedRounds = (rounds || []).map((entry) => ({ ...entry, state: migrateRound(entry.state) }));

  return { state: migratedState, rounds: migratedRounds, players: registry };
}

// 앱 부팅 시, render() 전에 단 한 번 호출한다. schemaVersion이 2 이상이면 손대지 않는다.
// 예외가 나면 아무것도 저장하지 않고 v1 상태로 계속 동작한다 — 반쯤 바뀐 데이터가 남는 게 최악이다.
function migrateIfNeeded() {
  const version = parseInt(localStorage.getItem(SCHEMA_KEY) || "1", 10);
  if (version >= 2) return;

  try {
    const rawState = localStorage.getItem(STORE_KEY);
    const state = rawState ? JSON.parse(rawState) : null;
    const rounds = JSON.parse(localStorage.getItem(ROUNDS_KEY) || "[]");
    const result = migrateStore({ state, rounds, players: [] });

    if (result.state) localStorage.setItem(STORE_KEY, JSON.stringify(result.state));
    localStorage.setItem(ROUNDS_KEY, JSON.stringify(result.rounds));
    localStorage.setItem(PLAYERS_KEY, JSON.stringify(result.players));
    localStorage.setItem(SCHEMA_KEY, "2");
  } catch (e) {
    // 아무것도 쓰지 않는다.
  }
}


// ---- data/scan.js ----
// 스코어카드 사진 -> golf_scoring_scan_worker 호출. 워커가 Anthropic API 키를 들고 있어서
// 여기선 사진과 최소 정보(홀 수, 선수 이름 순서)만 보낸다. 실패하면 한국어로 이유를 알 수 있는
// Error를 던진다 — 호출자가 그대로 toast()에 넘겨도 되게.
//
// WORKER_URL/APP_TOKEN은 golf_scoring_scan_worker 배포 후 실제 값으로 바꿔야 한다
// (golf_scoring_scan_worker/README.md 참고). 둘 다 "비밀"은 아니다 — 클라이언트 JS에 그대로
// 들어가는 값이고, 실제 방어선은 워커 쪽 Anthropic API 키(서버에만 있음)다.
const WORKER_URL = "https://REPLACE-ME.workers.dev/scan";
const APP_TOKEN = "REPLACE-ME";

const MAX_DIMENSION = 1600; // 리사이즈 후 긴 변 기준 px — 업로드 용량/비전 API 토큰 비용 절감용

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]); // "data:...;base64," 접두사 제거
    reader.onerror = () => reject(new Error("파일을 읽지 못했습니다."));
    reader.readAsDataURL(blob);
  });
}

// 폰 카메라 원본(보통 3~8MB)을 그대로 보내면 코스 와이파이에서 느리고 API 비용도 커진다.
// 캔버스로 리사이즈 + JPEG 재압축해서 보낸다.
async function prepareImage(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, MAX_DIMENSION / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
  if (!blob) throw new Error("사진을 처리하지 못했습니다.");
  return { base64: await blobToBase64(blob), mimeType: "image/jpeg" };
}

// totalHoles/players(이름 배열, 스코어카드 열 순서와 같다고 가정)를 받아 워커에 인식을 요청한다.
// 성공하면 { holes: [{hole,par,scores:{이름:타수|null}}], warnings: string[] }를 돌려준다.
async function scanScorecard(file, { totalHoles, players }) {
  let image, mimeType;
  try {
    ({ base64: image, mimeType } = await prepareImage(file));
  } catch {
    throw new Error("사진을 처리하지 못했습니다. 다른 사진으로 다시 시도해주세요.");
  }

  let res;
  try {
    res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Token": APP_TOKEN },
      body: JSON.stringify({ image, mimeType, totalHoles, players }),
    });
  } catch {
    throw new Error("네트워크 연결을 확인해주세요. 신호가 약하면 그냥 직접 입력해도 됩니다.");
  }

  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error || ""; } catch { /* 응답이 JSON이 아니면 무시 */ }
    throw new Error(`인식에 실패했습니다${detail ? ": " + detail : ""}. 직접 입력해주세요.`);
  }

  return res.json();
}


// ---- core/scan.js ----
// 워커가 돌려준 스캔 결과({holes:[{hole,par,scores:{이름:타수|null}}], warnings})를
// 앱 내부 키(4인 모드는 a1/a2/b1/b2, 단체전은 player.id)로 바꾼다. 순수 함수 — DOM/localStorage 모름.
// 모드별 홀 객체 조립(par/a1../bonus vs par/scores/nearest/longest)은 호출자(ui) 몫으로 남긴다 —
// 이 함수는 "이름 -> 우리 쪽 키" 치환과 값 검증까지만 한다.
function mapScanScores(scanResult, keyedPlayers) {
  return scanResult.holes.map((h) => {
    const scores = {};
    for (const { key, name } of keyedPlayers) {
      const v = h.scores ? h.scores[name] : undefined;
      scores[key] = Number.isInteger(v) && v >= 1 && v <= 20 ? v : null;
    }
    const par = [3, 4, 5].includes(h.par) ? h.par : null;
    return { par, scores };
  });
}

  const total = state.totalHoles;
  const finished = doneCount(state) >= total;

  // 라운드가 끝나면 즉시 보관함에 넣는다. "새 라운드"를 눌러도 기록이 남도록.
  if (finished) archiveRound(state);

  if (isGroup(state)) {
    if (finished && editingIdx == null) renderGroupFinal(false);
    else renderGroupPlay();
  } else {
    if (finished && editingIdx == null) renderFinal(false);
    else renderPlay();
  }
}

const MODE_INFO = {
  skins: { title: "스킨스 정산", label: "스킨스만", sub: "2v2 팀전" },
  both: { title: "스킨스 + 신페리오", label: "합쳐서", sub: "한 번 입력" },
  peoria: { title: "신페리오 개인전", label: "신페리오만", sub: "4인 개인전" },
};

function renderSetup() {
  if (setupMode === "group") { renderGroupSetup(); return; }

  const needsSkins = setupMode !== "peoria";
  const needsPeoria = setupMode !== "skins";

  root.innerHTML = `
    <h1>골프 스코어 정산</h1>
    <div class="subtitle">스코어는 한 번만 입력하고, 선택한 모드에 맞춰 스킨스·신페리오 결과를 계산합니다.</div>
    <div class="card">
      <label>모드</label>
      <div class="row3">
        <button class="mode-btn" id="modeSkins">스킨스만<span class="sub">2v2 팀전</span></button>
        <button class="mode-btn" id="modeBoth">합쳐서<span class="sub">한 번 입력</span></button>
        <button class="mode-btn" id="modePeoria">신페리오만<span class="sub">4인 개인전</span></button>
      </div>
      <button class="mode-btn mode-wide" id="modeGroup">단체전 스코어카드<span class="sub">8명 이상 · 롱기/니어/시상</span></button>

      <label>골프장 (선택)</label>
      <input type="text" id="club" placeholder="예) OO CC" value="" />
      <div class="row2" style="margin-top:10px;">
        <input type="text" id="courseFront" placeholder="전반 코스 (예: 동코스)" value="" />
        <input type="text" id="courseBack" placeholder="후반 코스 (예: 서코스)" value="" />
      </div>

      <label>선수 이름${needsSkins ? " (A팀 / B팀)" : ""}</label>
      <div class="row2">
        <input type="text" id="a1" placeholder="${needsSkins ? "A팀 선수1" : "선수1"}" value="${needsSkins ? "A1" : "선수1"}" />
        <input type="text" id="a2" placeholder="${needsSkins ? "A팀 선수2" : "선수2"}" value="${needsSkins ? "A2" : "선수2"}" />
      </div>
      <div class="row2" style="margin-top:10px;">
        <input type="text" id="b1" placeholder="${needsSkins ? "B팀 선수1" : "선수3"}" value="${needsSkins ? "B1" : "선수3"}" />
        <input type="text" id="b2" placeholder="${needsSkins ? "B팀 선수2" : "선수4"}" value="${needsSkins ? "B2" : "선수4"}" />
      </div>

      <div id="holesField" class="${needsPeoria ? "hidden" : ""}">
        <label>홀 수</label>
        <div class="row2">
          <button class="btn-ghost" id="holes9" style="padding:11px 0;">9홀</button>
          <button class="btn-ghost" id="holes18" style="padding:11px 0;">18홀</button>
        </div>
      </div>
      <div class="subtitle ${needsPeoria ? "" : "hidden"}" style="margin:12px 0 0;">신페리오가 포함되면 18홀 고정입니다.</div>

      <div id="skinsStakeField" class="${needsSkins ? "" : "hidden"}">
        <label>홀당 판돈 (원)</label>
        <input type="number" id="skinsStake" value="10000" step="1000" min="1000" />
      </div>
      <div id="peoriaStakeField" class="${needsPeoria ? "" : "hidden"}">
        <label>타당 금액 (원, 신페리오)</label>
        <input type="number" id="peoriaStake" value="10000" step="10000" min="10000" />
      </div>

      <button class="btn-primary" id="startBtn">시작</button>
    </div>
    ${archiveHtml()}
  `;

  paintModeButtons();
  bindArchive();

  document.getElementById("modeSkins").onclick = () => { setupMode = "skins"; renderSetup(); };
  document.getElementById("modeBoth").onclick = () => { setupMode = "both"; renderSetup(); };
  document.getElementById("modePeoria").onclick = () => { setupMode = "peoria"; renderSetup(); };
  document.getElementById("modeGroup").onclick = () => { setupMode = "group"; renderSetup(); };

  if (needsSkins) {
    const h9 = document.getElementById("holes9");
    const h18 = document.getElementById("holes18");
    function paintHoleButtons() {
      h9.style.background = setupHoles === 9 ? "var(--cream)" : "transparent";
      h9.style.color = setupHoles === 9 ? "var(--bg)" : "var(--brass)";
      h18.style.background = setupHoles === 18 ? "var(--cream)" : "transparent";
      h18.style.color = setupHoles === 18 ? "var(--bg)" : "var(--brass)";
    }
    paintHoleButtons();
    h9.onclick = () => { setupHoles = 9; paintHoleButtons(); };
    h18.onclick = () => { setupHoles = 18; paintHoleButtons(); };
  }

  document.getElementById("startBtn").onclick = () => {
    const names = {
      a1: document.getElementById("a1").value.trim() || (needsSkins ? "A1" : "선수1"),
      a2: document.getElementById("a2").value.trim() || (needsSkins ? "A2" : "선수2"),
      b1: document.getElementById("b1").value.trim() || (needsSkins ? "B1" : "선수3"),
      b2: document.getElementById("b2").value.trim() || (needsSkins ? "B2" : "선수4"),
    };
    const totalHoles = needsPeoria ? 18 : setupHoles;
    const skinsStakeEl = document.getElementById("skinsStake");
    const peoriaStakeEl = document.getElementById("peoriaStake");
    const skinsStake = needsSkins ? Math.max(1000, parseInt(skinsStakeEl.value, 10) || 10000) : 0;
    const peoriaStake = needsPeoria ? Math.max(10000, parseInt(peoriaStakeEl.value, 10) || 10000) : 0;
    const club = document.getElementById("club").value.trim();
    const courseFront = document.getElementById("courseFront").value.trim();
    const courseBack = document.getElementById("courseBack").value.trim();
    // 이름 그대로 등록부에서 찾거나 새로 만든다 — 화면은 안 바뀌고 뒤에서 조용히 연결만 된다.
    const players = {
      a1: resolvePlayerAndSave(names.a1), a2: resolvePlayerAndSave(names.a2),
      b1: resolvePlayerAndSave(names.b1), b2: resolvePlayerAndSave(names.b2),
    };
    state = newState({ mode: setupMode, names, totalHoles, skinsStake, peoriaStake, club, courseFront, courseBack, players });
    saveState(state);
    editingIdx = null;
    pendingPar = null;
    render();
  };
}

function paintModeButtons() {
  const map = { modeSkins: "skins", modeBoth: "both", modePeoria: "peoria", modeGroup: "group" };
  for (const [id, mode] of Object.entries(map)) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("active", setupMode === mode);
  }
}

// 골프장/코스 표시용 — 전반·후반 코스가 같으면 한 번만, 다르면 "동코스·서코스"처럼 붙인다.
function courseLabel(st) {
  const front = (st.courseFront || "").trim();
  const back = (st.courseBack || "").trim();
  if (front && back) return front === back ? front : `${front}·${back}`;
  return front || back || "";
}
function venueLabel(st) {
  return [st.club, courseLabel(st)].filter((v) => v && v.trim()).join(" · ");
}

// ---- 보관함 목록(설정 화면 하단) ----
function roundSummaryLine(st) {
  if (isGroup(st)) {
    const g = computeGroup(st);
    const win = g.peoriaWinner || g.grossWinner;
    return `${st.players.length}명 · ${win ? `우승 ${win.name}` : "기록 없음"}`;
  }
  const parts = [];
  if (st.mode !== "peoria") {
    const s = computeSkins(st);
    const net = s.totalA - s.totalB;
    parts.push(net === 0 ? "스킨스 무승부" : `스킨스 ${net > 0 ? "A팀" : "B팀"} +${fmt(Math.abs(net))}원`);
  }
  if (st.mode !== "skins" && countDone(st) >= st.totalHoles) {
    parts.push(`신페리오 ${computePeoria(st).results[0].name}`);
  }
  return parts.join(" · ") || "기록 없음";
}

function archiveHtml() {
  const rounds = loadRounds();
  if (rounds.length === 0) return "";
  return `
    <label class="section-gap">지난 라운드 (${rounds.length})</label>
    <div class="card" style="padding:0;">
      ${rounds.slice(0, 12).map((r) => {
        const st = r.state;
        const title = isGroup(st)
          ? (st.title || "단체전")
          : `${st.names.a1}·${st.names.a2} vs ${st.names.b1}·${st.names.b2}`;
        const venue = venueLabel(st);
        return `
          <div class="round-item" data-id="${r.id}">
            <div style="min-width:0;">
              <div class="t">${esc(title)}</div>
              <div class="s">${venue ? `${esc(venue)} · ` : ""}${dateLabel(st.startedAt || r.savedAt)} · ${esc(roundSummaryLine(st))}</div>
            </div>
            <button class="del" data-del="${r.id}">✕</button>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function bindArchive() {
  document.querySelectorAll(".round-item").forEach((el) => {
    el.onclick = (e) => {
      if (e.target.dataset.del) return;
      const found = loadRounds().find((r) => r.id === el.dataset.id);
      if (found) { viewing = found.state; window.scrollTo({ top: 0 }); render(); }
    };
  });
  document.querySelectorAll("[data-del]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      if (confirm("이 라운드 기록을 삭제할까요?")) { deleteRound(el.dataset.del); render(); }
    };
  });
}

function renderPlay() {
  const needsSkins = state.mode !== "peoria";
  const needsPeoria = state.mode !== "skins";
  const skins = needsSkins ? computeSkins(state) : null;
  const done = countDone(state);
  const title = MODE_INFO[state.mode].title;

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 4px;">
      <h1 style="margin:0;">${title}</h1>
      <button class="btn-ghost" id="resetBtn">새 라운드</button>
    </div>
    ${venueLabel(state) ? `<div class="subtitle" style="margin-bottom:6px;">⛳ ${esc(venueLabel(state))}</div>` : ""}
    <div style="text-align:right; margin-bottom:10px;">${scanButtonHtml()}</div>
  `;

  if (needsSkins) {
    html += `
      <div class="subtitle">${state.names.a1}·${state.names.a2} <span class="team-badge team-a">A팀</span>
        &nbsp;vs&nbsp;
        ${state.names.b1}·${state.names.b2} <span class="team-badge team-b">B팀</span>
        · 홀당 ${fmt(state.skinsStake)}원 · ${state.totalHoles}홀${needsPeoria ? " · 신페리오 동시 진행 중" : ""}</div>
    `;
    const net = skins.totalA - skins.totalB;
    html += `
      <div class="summary">
        <div><span class="team-badge team-a">A팀</span><div class="amt" style="color:var(--brass)">${fmt(skins.totalA)}원</div></div>
        <div><span class="team-badge team-b">B팀</span><div class="amt" style="color:var(--red)">${fmt(skins.totalB)}원</div></div>
      </div>
      <div class="net-line">
        ${net === 0 ? "현재 동률" : net > 0
          ? `<b>B팀이 A팀에게 ${fmt(Math.abs(net))}원</b> 지급 상황`
          : `<b>A팀이 B팀에게 ${fmt(Math.abs(net))}원</b> 지급 상황`}
      </div>
    `;
  } else {
    html += `<div class="progress">${done}/${state.totalHoles}홀 완료 · 페리오 홀과 핸디캡은 18홀 종료 후 공개됩니다</div>`;
  }

  const holeNum = done + 1;
  const editIdx = editingIdx != null ? editingIdx : done;
  const editingPast = editingIdx != null;
  const existing = state.holes[editIdx];

  const potForThisHole = needsSkins
    ? (editingPast
        ? (skins.rows[editIdx] ? skins.rows[editIdx].pot : state.skinsStake)
        : (state.skinsStake + skins.carry) * (existing.bonus || 1))
    : null;

  if (!pendingPar || pendingPar.idx !== editIdx) {
    pendingPar = { idx: editIdx, par: existing.par ?? defaultPar(state, editIdx) };
  }
  const par = pendingPar.par;

  const playerRow = (key, label, teamClass, teamLetter) => `
    <div class="player-block">
      <div class="pname">
        ${needsSkins
          ? `<span class="team-badge ${teamClass}">${teamLetter}</span>`
          : `<span class="player-badge">${label.charAt(0)}</span>`}
        ${label}
      </div>
      <div class="chip-row">
        ${REL_CHIPS.map((c) => `<button class="chip" data-key="${key}" data-delta="${c.delta}">${c.label}</button>`).join("")}
        <button class="chip" data-key="${key}" data-abs="${ONYANG_STROKES}">양파</button>
      </div>
      <input type="number" id="in_${key}" inputmode="numeric" value="${existing[key] ?? ""}" placeholder="직접 입력" />
    </div>
  `;

  html += `
    <div class="card">
      ${needsSkins && existing.bonus ? `<div class="bonus-banner">🎁 보너스 홀! 이번 홀 판돈 ×${existing.bonus}</div>` : ""}
      <div class="hole-head">
        <span class="n">${editingPast ? editIdx + 1 : holeNum}홀${editingPast ? " (수정)" : ""}</span>
        ${needsSkins ? `
          <span class="pot-tag">
            이번 홀 ${fmt(potForThisHole)}원
            ${!editingPast && skins.carry > 0 ? `<span class="carry">(이월 ${fmt(skins.carry)}원 포함)</span>` : ""}
          </span>
        ` : ""}
      </div>
      <div class="par-row">
        ${[3, 4, 5].map((p) => `<button class="par-btn ${p === par ? "active" : ""}" data-par="${p}">파${p}</button>`).join("")}
      </div>
      ${playerRow("a1", state.names.a1, "team-a", "A")}
      ${playerRow("a2", state.names.a2, "team-a", "A")}
      ${playerRow("b1", state.names.b1, "team-b", "B")}
      ${playerRow("b2", state.names.b2, "team-b", "B")}
      <button class="btn-primary" id="confirmBtn">${editingPast ? "수정 저장" : "확정"}</button>
      ${editingPast ? `<button class="btn-ghost" id="cancelEditBtn" style="width:100%; margin-top:8px; text-align:center;">취소</button>` : ""}
    </div>
  `;

  html += `<label class="section-gap">홀별 기록</label>`;
  if (needsSkins) {
    if (skins.rows.length === 0) {
      html += `<div class="card"><div class="empty-note">아직 확정된 홀이 없습니다</div></div>`;
    } else {
      html += `<div class="card" style="padding:0;">`;
      for (const r of [...skins.rows].reverse()) {
        const bonusTag = r.bonus ? ` (보너스×${r.bonus})` : "";
        const resultText = r.winner === "carry"
          ? `캐리오버${bonusTag}`
          : r.winner === "A"
          ? `A팀 +${fmt(r.pot)}원${bonusTag}`
          : `B팀 +${fmt(r.pot)}원${bonusTag}`;
        const resultClass = r.winner === "carry" ? "carry" : r.winner === "A" ? "win-a" : "win-b";
        const rPar = r.par ?? 4;
        const relStr = (v) => holeLabel(v, rPar);
        html += `
          <div class="hole-row" data-idx="${r.idx}">
            <div class="left">
              <span class="hn">${r.idx + 1}</span>
              <span>파${rPar} · ${r.a1}(${relStr(r.a1)})+${r.a2}(${relStr(r.a2)})=${r.teamA}
                vs ${r.b1}(${relStr(r.b1)})+${r.b2}(${relStr(r.b2)})=${r.teamB}</span>
            </div>
            <span class="result ${resultClass}">${resultText}</span>
          </div>
        `;
      }
      html += `</div>`;
    }
  } else {
    if (done === 0) {
      html += `<div class="card"><div class="empty-note">아직 확정된 홀이 없습니다</div></div>`;
    } else {
      html += `<div class="card" style="padding:0;">`;
      for (let i = done - 1; i >= 0; i--) {
        const h = state.holes[i];
        const parts = PLAYER_KEYS.map((k) => `${state.names[k]} ${h[k]}(${holeLabel(h[k], h.par)})`).join(" · ");
        html += `
          <div class="hole-row" data-idx="${i}">
            <div class="left">
              <span class="hn">${i + 1}</span>
              <span>파${h.par} · ${parts}</span>
            </div>
          </div>
        `;
      }
      html += `</div>`;
    }
  }

  root.innerHTML = html;

  const confirmBtn = document.getElementById("confirmBtn");
  confirmBtn.onclick = () => {
    const a1 = parseInt(document.getElementById("in_a1").value, 10);
    const a2 = parseInt(document.getElementById("in_a2").value, 10);
    const b1 = parseInt(document.getElementById("in_b1").value, 10);
    const b2 = parseInt(document.getElementById("in_b2").value, 10);
    if ([a1, a2, b1, b2].some((v) => isNaN(v) || v <= 0)) {
      alert("4명 타수를 모두 입력하세요.");
      return;
    }
    const idx = editingIdx != null ? editingIdx : done;
    state.holes[idx] = { ...state.holes[idx], par: pendingPar.par, a1, a2, b1, b2 };
    saveState(state);
    editingIdx = null;
    render();
  };

  document.querySelectorAll(".par-btn").forEach((el) => {
    el.onclick = () => {
      pendingPar = { idx: pendingPar.idx, par: parseInt(el.dataset.par, 10) };
      render();
    };
  });

  document.querySelectorAll(".chip").forEach((el) => {
    el.onclick = () => {
      const key = el.dataset.key;
      const value = el.dataset.abs != null
        ? parseInt(el.dataset.abs, 10)
        : pendingPar.par + parseInt(el.dataset.delta, 10);
      document.getElementById(`in_${key}`).value = value;
    };
  });

  const cancelBtn = document.getElementById("cancelEditBtn");
  if (cancelBtn) cancelBtn.onclick = () => { editingIdx = null; pendingPar = null; render(); };

  document.querySelectorAll(".hole-row").forEach((el) => {
    el.onclick = () => {
      editingIdx = parseInt(el.dataset.idx, 10);
      pendingPar = null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });

  bindResetButton();
  bindScanButton();
}

function renderFinal(ro) {
  const needsSkins = state.mode !== "peoria";
  const needsPeoria = state.mode !== "skins";
  const title = MODE_INFO[state.mode].title;

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 4px;">
      <h1 style="margin:0;">${title}</h1>
      <button class="btn-ghost" id="${ro ? "closeBtn" : "resetBtn"}">${ro ? "닫기" : "새 라운드"}</button>
    </div>
    ${venueLabel(state) ? `<div class="subtitle" style="margin-bottom:6px;">⛳ ${esc(venueLabel(state))}</div>` : ""}
  `;

  if (needsSkins) {
    const skins = computeSkins(state);
    const net = skins.totalA - skins.totalB;
    html += `
      <div class="summary">
        <div><span class="team-badge team-a">A팀</span><div class="amt" style="color:var(--brass)">${fmt(skins.totalA)}원</div></div>
        <div><span class="team-badge team-b">B팀</span><div class="amt" style="color:var(--red)">${fmt(skins.totalB)}원</div></div>
      </div>
      <div class="final-banner">
        <div class="title">스킨스 · 최종 정산</div>
        <div class="amount" style="color:${net === 0 ? "var(--creamDim)" : "var(--ok)"}">
          ${net === 0 ? "무승부" : net > 0
            ? `B팀 → A팀 ${fmt(Math.abs(net))}원`
            : `A팀 → B팀 ${fmt(Math.abs(net))}원`}
        </div>
        <div style="font-size:12px; color:var(--creamDim); margin-top:8px;">
          ${net !== 0 ? `1인당 ${fmt(Math.round(Math.abs(net) / 2))}원씩` : ""}
        </div>
      </div>
    `;
  }

  if (needsPeoria) {
    const { coursePar, results } = computePeoria(state);
    html += `
      <div class="final-banner">
        <div class="title">신페리오 · 결과 공개</div>
        <div style="font-size:13px; color:var(--creamDim);">코스 파 ${coursePar} · 페리오 홀(전/후반 각 6홀)</div>
        <div class="peoria-list" style="margin-top:6px;">${state.peoriaHoles.map((i) => i + 1).join(", ")}번 홀</div>
      </div>

      <label>신페리오 순위</label>
      <div class="card">
        <table class="result-table">
          <tr><th>순위</th><th style="text-align:left;">이름</th><th>총타수</th><th>핸디</th><th>넷스코어</th></tr>
          ${results.map((r, i) => `
            <tr>
              <td>${i + 1}</td>
              <td class="name">${r.name}</td>
              <td>${r.total}</td>
              <td>${r.handicap}</td>
              <td>${r.net}</td>
            </tr>
          `).join("")}
        </table>
      </div>

      <div class="final-banner">
        <div class="title">신페리오 · 최종 정산</div>
        ${[...results].sort((a, b) => b.settle - a.settle).map((r) => `
          <div style="display:flex; justify-content:space-between; padding:7px 2px; font-size:15px; font-weight:700;">
            <span>${r.name}</span>
            <span style="color:${r.settle > 0 ? "var(--ok)" : r.settle < 0 ? "var(--red)" : "var(--creamDim)"};">
              ${r.settle > 0 ? "+" : ""}${fmt(r.settle)}원
            </span>
          </div>
        `).join("")}
      </div>
    `;
  }

  html += `<button class="btn-secondary" id="copyBtn" style="width:100%;">결과 복사 (카톡 공유용)</button>`;

  html += `<label class="section-gap">홀별 기록</label>`;
  html += `<div class="card" style="padding:0;">`;
  for (let i = state.totalHoles - 1; i >= 0; i--) {
    const h = state.holes[i];
    const parts = PLAYER_KEYS.map((k) => `${state.names[k]} ${h[k]}(${holeLabel(h[k], h.par)})`).join(" · ");
    html += `
      <div class="hole-row" data-idx="${i}">
        <div class="left">
          <span class="hn">${i + 1}</span>
          <span>파${h.par} · ${parts}</span>
        </div>
      </div>
    `;
  }
  html += `</div>`;

  root.innerHTML = html;

  document.getElementById("copyBtn").onclick = () => copyText(classicSummaryText(state));

  if (ro) {
    document.getElementById("closeBtn").onclick = () => { viewing = null; render(); };
  } else {
    // 18홀을 다 채운 뒤에도 마지막 홀 오타를 고칠 수 있어야 한다.
    document.querySelectorAll(".hole-row").forEach((el) => {
      el.onclick = () => {
        editingIdx = parseInt(el.dataset.idx, 10);
        pendingPar = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    });
    bindResetButton();
  }
}

function classicSummaryText(st) {
  const venue = venueLabel(st);
  const L = [`[${MODE_INFO[st.mode].title}] ${dateLabel(st.startedAt || Date.now())}${venue ? ` · ${venue}` : ""}`, ""];
  if (st.mode !== "peoria") {
    const s = computeSkins(st);
    const net = s.totalA - s.totalB;
    L.push(`A팀 ${st.names.a1}·${st.names.a2} ${fmt(s.totalA)}원`);
    L.push(`B팀 ${st.names.b1}·${st.names.b2} ${fmt(s.totalB)}원`);
    L.push(net === 0 ? "→ 무승부" : `→ ${net > 0 ? "B팀 → A팀" : "A팀 → B팀"} ${fmt(Math.abs(net))}원 (1인당 ${fmt(Math.round(Math.abs(net) / 2))}원)`);
    L.push("");
  }
  if (st.mode !== "skins" && countDone(st) >= st.totalHoles) {
    const { results } = computePeoria(st);
    L.push("— 신페리오 —");
    results.forEach((r, i) => L.push(`${i + 1}. ${r.name}  ${r.total}타 / 핸디 ${r.handicap} / 넷 ${r.net} / ${r.settle > 0 ? "+" : ""}${fmt(r.settle)}원`));
  }
  return L.join("\n");
}

// ---- 단체전: 설정 ----
function syncGroupInputs() {

  if (titleEl) setupGroup.title = titleEl.value;
  const clubEl = document.getElementById("gClub");
  const courseFrontEl = document.getElementById("gCourseFront");
  const courseBackEl = document.getElementById("gCourseBack");
  if (clubEl) setupGroup.club = clubEl.value;
  if (courseFrontEl) setupGroup.courseFront = courseFrontEl.value;
  if (courseBackEl) setupGroup.courseBack = courseBackEl.value;
  setupGroup.players.forEach((p, i) => {
    const nameEl = document.getElementById(`gName${i}`);

    if (nameEl) p.name = nameEl.value;
    if (cartEl) p.cart = parseInt(cartEl.value, 10) || 1;

}

          <select id="gCart${i}">

          </select>

// ---- 단체전: 홀 입력 ----
function renderGroupPlay() {
  const g = computeGroup(state);
  const done = g.done;
  const editingPast = editingIdx != null;
  const idx = editingPast ? editingIdx : Math.min(done, state.totalHoles - 1);
  const hole = state.holes[idx];

  if (!groupDraft || groupDraft.idx !== idx) {
    const par = hole.par ?? defaultPar(state, idx);
    groupDraft = {
      idx, par,
      scores: Object.fromEntries(state.players.map((p) => [p.id, hole.scores[p.id] ?? par])),
      nearest: hole.nearest || null,
      longest: hole.longest || null,
      // 이미 저장된 홀을 다시 여는 경우엔 전원 입력된 것으로 본다(파를 바꿔도 값이 안 밀리게).
      touched: new Set(hole.par != null ? state.players.map((p) => p.id) : []),
    };
  }

  const carts = [...new Set(state.players.map((p) => p.cart))].sort((a, b) => a - b);
  const shown = groupTab === 0 ? state.players : state.players.filter((p) => p.cart === groupTab);

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 4px; gap:10px;">
      <h1 style="margin:0; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(state.title)}</h1>
      <button class="btn-ghost" id="resetBtn" style="flex-shrink:0;">새 라운드</button>
    </div>
    <div class="progress">${venueLabel(state) ? `⛳ ${esc(venueLabel(state))} · ` : ""}${state.players.length}명 · ${done}/${state.totalHoles}홀 완료${
      state.usePeoria ? " · 페리오 홀은 종료 후 공개" : ""
    }</div>
    <div style="text-align:right; margin-bottom:10px;">${scanButtonHtml()}</div>
  `;

  if (carts.length > 1) {
    html += `<div class="tab-row">
      <button class="tab ${groupTab === 0 ? "active" : ""}" data-tab="0">전체</button>
      ${carts.map((c) => `<button class="tab ${groupTab === c ? "active" : ""}" data-tab="${c}">${c}조</button>`).join("")}
    </div>`;
  }

  html += `
    <div class="card">
      <div class="hole-head">
        <span class="n">${idx + 1}홀${editingPast ? " (수정)" : ""}</span>
        <span class="pot-tag">${shown.length}명 표시 중</span>
      </div>
      <div class="par-row">
        ${[3, 4, 5].map((p) => `<button class="par-btn ${p === groupDraft.par ? "active" : ""}" data-par="${p}">파${p}</button>`).join("")}
      </div>
      <div id="specialBox"></div>
      ${shown.map((p) => `
        <div class="grow">
          <div class="gname">
            ${carts.length > 1 ? `<span class="cart-pill">${p.cart}조</span>` : ""}
            <span class="nm">${esc(p.name)}</span>
          </div>
          <div class="stepper">
            <button data-step="-1" data-id="${p.id}">−</button>
            <div class="val"><span class="num" id="gv_${p.id}"></span><span class="rel" id="gr_${p.id}"></span></div>
            <button data-step="1" data-id="${p.id}">+</button>
            <button class="oy" data-oy="${p.id}">양파</button>
          </div>
        </div>
      `).join("")}
      <button class="btn-primary" id="confirmGroupBtn">${editingPast ? "수정 저장" : "확정"}</button>
      ${editingPast ? `<button class="btn-ghost" id="cancelEditBtn" style="width:100%; margin-top:8px;">취소</button>` : ""}
      <div class="warn-note" id="untouchedNote"></div>
    </div>
  `;

  if (done > 0) {
    html += `<label class="section-gap">현재 타수 순위</label><div class="card" style="padding:0;">`;
    html += g.gross.slice(0, 5).map((r, i) => `
      <div class="settle-row">
        <span>${i + 1}. ${esc(r.name)}</span>
        <span class="amt ${r.vsPar <= 0 ? "pos" : ""}">${r.total}타 (${r.vsPar > 0 ? "+" : ""}${r.vsPar})</span>
      </div>
    `).join("");
    html += `</div>`;
  }

  html += `<label class="section-gap">홀별 기록</label>`;
  if (done === 0) {
    html += `<div class="card"><div class="empty-note">아직 확정된 홀이 없습니다</div></div>`;
  } else {
    html += `<div class="card" style="padding:0;">`;
    for (let i = done - 1; i >= 0; i--) html += groupHoleRow(state, i);
    html += `</div>`;
  }

  root.innerHTML = html;
  paintSpecial();
  state.players.forEach((p) => paintGroupRow(p.id));
  paintUntouchedNote();

  document.querySelectorAll("[data-tab]").forEach((el) => {
    el.onclick = () => { groupTab = parseInt(el.dataset.tab, 10); render(); };
  });

  document.querySelectorAll(".par-btn").forEach((el) => {
    el.onclick = () => {
      const newPar = parseInt(el.dataset.par, 10);
      groupDraft.par = newPar;
      // 아직 손대지 않은 사람은 파 기준값을 따라가게 한다.
      state.players.forEach((p) => {
        if (!groupDraft.touched.has(p.id)) groupDraft.scores[p.id] = newPar;
      });
      if (newPar !== 3) groupDraft.nearest = null;
      if (newPar !== 5) groupDraft.longest = null;
      document.querySelectorAll(".par-btn").forEach((b) => {
        b.classList.toggle("active", parseInt(b.dataset.par, 10) === newPar);
      });
      state.players.forEach((p) => paintGroupRow(p.id));
      paintSpecial();
      paintUntouchedNote();
    };
  });

  document.querySelectorAll("[data-step]").forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.id;
      const delta = parseInt(el.dataset.step, 10);
      const next = Math.min(20, Math.max(1, groupDraft.scores[id] + delta));
      groupDraft.scores[id] = next;
      groupDraft.touched.add(id);
      paintGroupRow(id);
      paintUntouchedNote();
    };
  });

  document.querySelectorAll("[data-oy]").forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.oy;
      groupDraft.scores[id] = ONYANG_STROKES;
      groupDraft.touched.add(id);
      paintGroupRow(id);
      paintUntouchedNote();
    };
  });

  document.getElementById("confirmGroupBtn").onclick = () => {
    const missing = state.players.filter((p) => !groupDraft.touched.has(p.id));
    if (missing.length > 0 && missing.length !== state.players.length) {
      const names = missing.map((p) => p.name).join(", ");
      if (!confirm(`${names} — 아직 안 건드린 사람이 있습니다. 파(${groupDraft.par}타)로 저장할까요?`)) return;
    }
    state.holes[groupDraft.idx] = {
      par: groupDraft.par,
      scores: { ...groupDraft.scores },
      nearest: groupDraft.par === 3 ? groupDraft.nearest : null,
      longest: groupDraft.par === 5 ? groupDraft.longest : null,
    };
    saveState(state);
    editingIdx = null;
    groupDraft = null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const cancelBtn = document.getElementById("cancelEditBtn");
  if (cancelBtn) cancelBtn.onclick = () => { editingIdx = null; groupDraft = null; render(); };

  document.querySelectorAll(".hole-row").forEach((el) => {
    el.onclick = () => {
      editingIdx = parseInt(el.dataset.idx, 10);
      groupDraft = null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });

  bindResetButton();
  bindScanButton();
}

function paintGroupRow(id) {
  const numEl = document.getElementById(`gv_${id}`);
  const relEl = document.getElementById(`gr_${id}`);
  if (!numEl || !relEl) return; // 다른 조 탭이라 화면에 없는 경우
  const v = groupDraft.scores[id];
  const d = v - groupDraft.par;
  numEl.textContent = v;
  relEl.textContent = holeLabel(v, groupDraft.par);
  relEl.className = "rel" + (d > 0 ? " over" : d < 0 ? " under" : "");
}

function paintUntouchedNote() {
  const el = document.getElementById("untouchedNote");
  if (!el) return;
  const n = state.players.filter((p) => !groupDraft.touched.has(p.id)).length;
  el.textContent = n > 0 && n < state.players.length
    ? `아직 ${n}명은 파 기준값 그대로입니다`
    : "";
}

// 파3이면 니어, 파5면 롱기를 그 자리에서 기록한다.
function paintSpecial() {
  const box = document.getElementById("specialBox");
  if (!box) return;
  const par = groupDraft.par;
  if (par !== 3 && par !== 5) { box.innerHTML = ""; return; }
  const isNear = par === 3;
  const current = isNear ? groupDraft.nearest : groupDraft.longest;
  box.innerHTML = `
    <div class="special-box">
      <div class="lab">${isNear ? "🎯 니어리스트 (파3)" : "💥 롱기스트 (파5)"}</div>
      <div class="chip-row">
        ${state.players.map((p) => `
          <button class="name-chip ${current === p.id ? "on" : ""}" data-sp="${p.id}">${esc(p.name)}</button>
        `).join("")}
        <button class="name-chip ${!current ? "on" : ""}" data-sp="">없음</button>
      </div>
    </div>
  `;
  box.querySelectorAll("[data-sp]").forEach((el) => {
    el.onclick = () => {
      const val = el.dataset.sp || null;
      if (isNear) groupDraft.nearest = val; else groupDraft.longest = val;
      paintSpecial();
    };
  });
}

function groupHoleRow(st, i) {
  const h = st.holes[i];
  const nameOf = (id) => (st.players.find((p) => p.id === id) || {}).name || "";
  const best = st.players.reduce((a, p) => (h.scores[p.id] < h.scores[a.id] ? p : a), st.players[0]);
  const tags = [];
  if (h.par === 3 && h.nearest) tags.push(`🎯 ${nameOf(h.nearest)}`);
  if (h.par === 5 && h.longest) tags.push(`💥 ${nameOf(h.longest)}`);
  const scores = st.players.map((p) => h.scores[p.id]);
  const avg = (scores.reduce((s, v) => s + v, 0) / scores.length).toFixed(1);
  return `
    <div class="hole-row" data-idx="${i}">
      <div class="left" style="min-width:0;">
        <span class="hn">${i + 1}</span>
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          파${h.par} · 베스트 ${esc(best.name)} ${h.scores[best.id]}타(${holeLabel(h.scores[best.id], h.par)}) · 평균 ${avg}
          ${tags.length ? ` · ${tags.join(" ")}` : ""}
        </span>
      </div>
    </div>
  `;
}

// ---- 단체전: 시상 결과 ----
function renderGroupFinal(ro) {
  const g = computeGroup(state);
  const listText = (arr) => arr.map((x) => `${x.hole}번홀 ${x.name}`).join(" · ");

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 4px; gap:10px;">
      <h1 style="margin:0; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(state.title)}</h1>
      <button class="btn-ghost" id="${ro ? "closeBtn" : "resetBtn"}" style="flex-shrink:0;">${ro ? "닫기" : "새 라운드"}</button>
    </div>
    <div class="progress">${venueLabel(state) ? `⛳ ${esc(venueLabel(state))} · ` : ""}${dateLabel(state.startedAt)} · ${state.players.length}명 · 코스 파 ${g.coursePar}</div>
  `;

  html += `<label>시상</label><div class="card" style="padding:0;">`;
  if (g.peoriaWinner) {
    html += `
      <div class="award">
        <div class="ico">🏆</div>
        <div class="body">
          <div class="cat">우승 · 신페리오</div>
          <div class="who">${esc(g.peoriaWinner.name)}</div>
          <div class="det">넷 ${g.peoriaWinner.net}타 (총 ${g.peoriaWinner.total}타 − 핸디 ${g.peoriaWinner.handicap})${
            state.excludeGross && g.grossWinner && g.peoria[0] && g.peoria[0].id !== g.peoriaWinner.id
              ? ` · ${esc(g.peoria[0].name)}는 타수 1등이라 제외` : ""
          }</div>
        </div>
      </div>
    `;
  }
  if (g.grossWinner) {
    html += `
      <div class="award">
        <div class="ico">🥇</div>
        <div class="body">
          <div class="cat">메달리스트 · 타수 1등</div>
          <div class="who">${esc(g.grossWinner.name)}</div>
          <div class="det">${g.grossWinner.total}타 (${g.grossWinner.vsPar > 0 ? "+" : ""}${g.grossWinner.vsPar})${
            g.gross[1] && g.gross[1].total === g.grossWinner.total ? " · 동타, 카운트백으로 결정" : ""
          }</div>
        </div>
      </div>
    `;
  }
  html += `
    <div class="award">
      <div class="ico">🎯</div>
      <div class="body">
        <div class="cat">니어리스트 · 파3</div>
        <div class="who">${g.nearestTally.length ? esc(g.nearestTally.map(([n, c]) => c > 1 ? `${n} ${c}회` : n).join(", ")) : "기록 없음"}</div>
        ${g.nearest.length ? `<div class="det">${esc(listText(g.nearest))}</div>` : ""}
      </div>
    </div>
    <div class="award">
      <div class="ico">💥</div>
      <div class="body">
        <div class="cat">롱기스트 · 파5</div>
        <div class="who">${g.longestTally.length ? esc(g.longestTally.map(([n, c]) => c > 1 ? `${n} ${c}회` : n).join(", ")) : "기록 없음"}</div>
        ${g.longest.length ? `<div class="det">${esc(listText(g.longest))}</div>` : ""}
      </div>
    </div>
  </div>`;

  if (g.peoriaReady) {
    html += `
      <div class="final-banner">
        <div class="title">신페리오 · 페리오 홀 공개</div>
        <div class="peoria-list">${state.peoriaHoles.map((i) => i + 1).join(", ")}번 홀 (전·후반 각 6홀)</div>
      </div>
    `;
  }

  const ranked = g.peoriaReady ? g.peoria : g.gross;
  html += `
    <label>전체 순위 ${g.peoriaReady ? "(신페리오 넷 기준)" : "(타수 기준)"}</label>
    <div class="card">
      <table class="result-table">
        <tr>
          <th>순위</th><th style="text-align:left;">이름</th><th>타수</th>
          ${g.peoriaReady ? "<th>핸디</th><th>넷</th>" : "<th>파대비</th>"}
        </tr>
        ${ranked.map((r, i) => `
          <tr>
            <td>${i + 1}</td>
            <td class="name">${esc(r.name)}</td>
            <td>${r.total}</td>
            ${g.peoriaReady
              ? `<td>${r.handicap}</td><td>${r.net}</td>`
              : `<td>${r.vsPar > 0 ? "+" : ""}${r.vsPar}</td>`}
          </tr>
        `).join("")}
      </table>
    </div>
    <button class="btn-secondary" id="copyBtn" style="width:100%;">결과 복사 (카톡 공유용)</button>
  `;

  html += `<label class="section-gap">홀별 기록</label><div class="card" style="padding:0;">`;
  for (let i = g.done - 1; i >= 0; i--) html += groupHoleRow(state, i);
  html += `</div>`;

  root.innerHTML = html;

  document.getElementById("copyBtn").onclick = () => copyText(groupSummaryText(state, g));

  if (ro) {
    document.getElementById("closeBtn").onclick = () => { viewing = null; render(); };
  } else {
    // 마지막 홀 오타도 고칠 수 있도록 결과 화면에서 홀을 눌러 수정할 수 있게 둔다.
    document.querySelectorAll(".hole-row").forEach((el) => {
      el.onclick = () => {
        editingIdx = parseInt(el.dataset.idx, 10);
        groupDraft = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    });
    bindResetButton();
  }
}

function groupSummaryText(st, g) {
  const venue = venueLabel(st);
  const L = [];
  L.push(`[${st.title}] ${dateLabel(st.startedAt)}${venue ? ` · ${venue}` : ""}`);
  L.push(`${st.players.length}명 · 코스 파 ${g.coursePar}`);
  L.push("");
  if (g.peoriaWinner) L.push(`🏆 우승(신페리오) ${g.peoriaWinner.name} — 넷 ${g.peoriaWinner.net}타`);
  if (g.grossWinner) L.push(`🥇 메달리스트 ${g.grossWinner.name} — ${g.grossWinner.total}타`);
  if (g.nearest.length) L.push(`🎯 니어 ${g.nearest.map((x) => `${x.hole}H ${x.name}`).join(", ")}`);
  if (g.longest.length) L.push(`💥 롱기 ${g.longest.map((x) => `${x.hole}H ${x.name}`).join(", ")}`);
  L.push("");
  L.push("— 전체 순위 —");
  const ranked = g.peoriaReady ? g.peoria : g.gross;
  ranked.forEach((r, i) => {
    L.push(g.peoriaReady
      ? `${i + 1}. ${r.name}  ${r.total}타 / 핸디 ${r.handicap} / 넷 ${r.net}`
      : `${i + 1}. ${r.name}  ${r.total}타 (${r.vsPar > 0 ? "+" : ""}${r.vsPar})`);
  });
  return L.join("\n");
}

function bindResetButton() {
  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) {
    resetBtn.onclick = () => {
      const played = state ? doneCount(state) : 0;
      const msg = played > 0
        ? `진행 중인 ${played}홀 기록을 보관함에 저장하고 새 라운드를 시작할까요?`
        : "새 라운드를 시작할까요?";
      if (confirm(msg)) {
        if (played > 0) archiveRound(state);
        localStorage.removeItem(STORE_KEY);
        state = null;
        editingIdx = null;
        pendingPar = null;
        groupDraft = null;
        groupTab = 0;
        render();
      }
    };
  }
}

// ---- 스코어카드 사진 인식 ----
// 4인 모드는 names.{a1,a2,b1,b2}, 단체전은 players[].id를 키로 쓴다 — 사진에서 인식한 이름을
// 이 키로 되돌려 매핑하는 데 쓴다(mapScanScores). 순서는 사진 속 열 순서와 같다고 가정한다.
function keyedPlayersFor(st) {
  return isGroup(st)
    ? st.players.map((p) => ({ key: p.id, name: p.name }))
    : PLAYER_KEYS.map((k) => ({ key: k, name: st.names[k] }));
}

function scanButtonHtml() {
  return `
    <button class="btn-ghost" id="scanBtn">📷 사진으로 채우기</button>
    <input type="file" accept="image/*" capture="environment" id="scanFileInput" class="hidden" />
  `;
}

function bindScanButton() {
  const btn = document.getElementById("scanBtn");
  const fileInput = document.getElementById("scanFileInput");
  if (!btn || !fileInput) return;
  btn.onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    fileInput.value = ""; // 같은 파일을 다시 골라도 change가 또 발생하도록
    if (!file) return;
    const keyedPlayers = keyedPlayersFor(state);
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "인식 중...";
    try {
      const result = await scanScorecard(file, { totalHoles: state.totalHoles, players: keyedPlayers.map((p) => p.name) });
      scanDraft = { holes: mapScanScores(result, keyedPlayers), warnings: result.warnings || [] };
      render();
    } catch (e) {
      toast(e.message || "인식에 실패했습니다. 직접 입력해주세요.");
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  };
}

// 인식 결과를 한 번에 보여주고, 틀린 칸만 고쳐서 일괄 반영하는 화면.
// 원본 사진 인식값은 여기서만 잠깐 들고 있고(scanDraft), "일괄 확정"을 눌러야 실제 state.holes에 쓴다
// — 자동으로 저장하지 않는다(돈 걸린 데이터라 사람이 반드시 확인하고 넘어가게).
function renderScanReview() {
  const grp = isGroup(state);
  const keyedPlayers = keyedPlayersFor(state);

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 4px;">
      <h1 style="margin:0; font-size:18px;">사진 인식 결과 확인</h1>
      <button class="btn-ghost" id="cancelScanBtn">취소</button>
    </div>
    <div class="subtitle">틀린 칸은 직접 눌러서 고친 뒤 아래 "일괄 확정"을 눌러주세요. 빈 칸은 인식하지 못한 칸입니다.</div>
  `;

  if (scanDraft.warnings.length > 0) {
    html += `
      <div class="card" style="border-color:var(--red);">
        <label style="margin:0 0 6px;">⚠️ 확인이 필요합니다</label>
        <div style="font-size:12.5px; color:var(--creamDim); line-height:1.6;">
          ${scanDraft.warnings.map((w) => esc(w)).join("<br>")}
        </div>
      </div>
    `;
  }

  html += `
    <div class="card" style="padding:10px; overflow-x:auto;">
      <table class="result-table" style="min-width:${100 + keyedPlayers.length * 60}px;">
        <tr>
          <th>홀</th><th>파</th>
          ${keyedPlayers.map((p) => `<th>${esc(p.name)}</th>`).join("")}
        </tr>
        ${scanDraft.holes.map((h, i) => `
          <tr>
            <td>${i + 1}</td>
            <td><input type="number" inputmode="numeric" data-scan-par="${i}" value="${h.par ?? ""}" style="width:44px; padding:6px; text-align:center;" /></td>
            ${keyedPlayers.map((p) => `
              <td><input type="number" inputmode="numeric" data-scan-score="${i}:${p.key}" value="${h.scores[p.key] ?? ""}" style="width:48px; padding:6px; text-align:center;" /></td>
            `).join("")}
          </tr>
        `).join("")}
      </table>
    </div>
    <button class="btn-primary" id="confirmScanBtn">일괄 확정</button>
  `;

  root.innerHTML = html;

  document.getElementById("cancelScanBtn").onclick = () => { scanDraft = null; render(); };

  document.querySelectorAll("[data-scan-par]").forEach((el) => {
    el.onchange = () => {
      const idx = parseInt(el.dataset.scanPar, 10);
      const v = parseInt(el.value, 10);
      scanDraft.holes[idx].par = Number.isInteger(v) ? v : null;
    };
  });
  document.querySelectorAll("[data-scan-score]").forEach((el) => {
    el.onchange = () => {
      const [idxStr, key] = el.dataset.scanScore.split(":");
      const v = parseInt(el.value, 10);
      scanDraft.holes[parseInt(idxStr, 10)].scores[key] = Number.isInteger(v) ? v : null;
    };
  });

  document.getElementById("confirmScanBtn").onclick = () => {
    const incomplete = scanDraft.holes.some((h) =>
      h.par == null || keyedPlayers.some((p) => h.scores[p.key] == null));
    if (incomplete && !confirm("빈 칸이 있습니다. 그래도 반영할까요? (빈 칸이 있는 홀부터는 미완료로 표시됩니다)")) return;

    scanDraft.holes.forEach((h, i) => {
      const existing = state.holes[i];
      if (grp) {
        const scores = { ...existing.scores };
        keyedPlayers.forEach((p) => {
          if (h.scores[p.key] != null) scores[p.key] = h.scores[p.key];
        });
        state.holes[i] = { par: h.par ?? existing.par, scores, nearest: existing.nearest, longest: existing.longest };
      } else {
        state.holes[i] = {
          ...existing,
          par: h.par ?? existing.par,
          a1: h.scores.a1 ?? existing.a1, a2: h.scores.a2 ?? existing.a2,
          b1: h.scores.b1 ?? existing.b1, b2: h.scores.b2 ?? existing.b2,
        };
      }
    });
    saveState(state);
    scanDraft = null;
    editingIdx = null;
    render();
  };
}

render();

</script>
</body>
</html>
